<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InnovateBot Chat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .message-container {
            max-height: 400px;
            overflow-y: auto;
        }
        .typing-indicator {
            display: none;
        }
        .typing-indicator.show {
            display: block;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">
    <div class="flex flex-col h-screen max-w-4xl mx-auto p-4">
        <!-- Chat Header -->
        <div class="bg-white rounded-t-xl shadow-lg p-4 mb-4 flex items-center">
            <div class="relative">
                <span class="absolute top-0 right-0 h-2 w-2 rounded-full bg-green-500 ring-2 ring-white"></span>
                <div class="flex items-center justify-center h-10 w-10 bg-blue-500 rounded-full text-white font-bold text-lg">
                    AI
                </div>
            </div>
            <div class="ml-4">
                <h1 class="text-xl font-bold text-gray-800">InnovateBot</h1>
                <p class="text-sm text-gray-500">Your AI Colleague</p>
            </div>
        </div>

        <!-- Chat Messages -->
        <div id="messages" class="flex-1 overflow-y-auto bg-white rounded-b-xl shadow-lg p-4 mb-4 space-y-4 message-container">
            <div class="flex justify-start">
                <div class="max-w-xs md:max-w-md p-4 rounded-3xl shadow-sm bg-gray-200 text-gray-800 rounded-bl-none">
                    <p>Hello! I'm InnovateBot, your AI colleague. I'm here to help you brainstorm solutions, streamline processes, or tackle any modern-day problem you're facing. What's on your mind today?</p>
                </div>
            </div>
        </div>

        <!-- Typing Indicator -->
        <div id="typingIndicator" class="flex justify-start mb-4 typing-indicator">
            <div class="max-w-xs md:max-w-md p-4 rounded-3xl shadow-sm bg-gray-200 text-gray-800 rounded-bl-none">
                <span class="animate-pulse">InnovateBot is thinking...</span>
            </div>
        </div>

        <!-- Input Area -->
        <div class="bg-white rounded-xl shadow-lg p-4">
            <div class="flex items-end space-x-2">
                <textarea
                    id="messageInput"
                    class="flex-1 p-3 border border-gray-300 rounded-xl resize-none focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all duration-200"
                    placeholder="Type your message here..."
                    rows="1"
                    style="max-height: 150px;"
                ></textarea>
                <button
                    id="sendButton"
                    class="px-6 py-3 bg-blue-500 text-white rounded-xl shadow-md hover:bg-blue-600 transition-colors duration-200 disabled:bg-gray-400 disabled:cursor-not-allowed font-semibold"
                >
                    Send
                </button>
            </div>
        </div>
    </div>

    <script>
        const messagesContainer = document.getElementById('messages');
        const messageInput = document.getElementById('messageInput');
        const sendButton = document.getElementById('sendButton');
        const typingIndicator = document.getElementById('typingIndicator');

        // Auto-resize textarea
        messageInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 150) + 'px';
        });

        // Handle Enter key
        messageInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        // Handle send button click
        sendButton.addEventListener('click', sendMessage);

        function addMessage(text, isUser = false) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `flex ${isUser ? 'justify-end' : 'justify-start'}`;
            
            const messageBubble = document.createElement('div');
            messageBubble.className = `max-w-xs md:max-w-md p-4 rounded-3xl shadow-sm ${
                isUser 
                    ? 'bg-blue-500 text-white rounded-br-none' 
                    : 'bg-gray-200 text-gray-800 rounded-bl-none'
            }`;
            
            const messageText = document.createElement('p');
            messageText.className = 'whitespace-pre-wrap';
            messageText.textContent = text;
            
            messageBubble.appendChild(messageText);
            messageDiv.appendChild(messageBubble);
            messagesContainer.appendChild(messageDiv);
            
            // Auto-scroll to bottom
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function showTypingIndicator() {
            typingIndicator.classList.add('show');
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function hideTypingIndicator() {
            typingIndicator.classList.remove('show');
        }

        async function sendMessage() {
            const message = messageInput.value.trim();
            if (!message) return;

            // Add user message
            addMessage(message, true);
            messageInput.value = '';
            messageInput.style.height = 'auto';
            
            // Disable input while processing
            sendButton.disabled = true;
            messageInput.disabled = true;
            
            // Show typing indicator
            showTypingIndicator();

            try {
                // Simulate API call (replace with actual API endpoint)
                const response = await simulateBotResponse(message);
                hideTypingIndicator();
                addMessage(response);
            } catch (error) {
                hideTypingIndicator();
                addMessage('Sorry, I encountered an error. Please try again.');
                console.error('Error:', error);
            } finally {
                // Re-enable input
                sendButton.disabled = false;
                messageInput.disabled = false;
                messageInput.focus();
            }
        }

        // Simulate bot response (replace with actual API call)
        async function simulateBotResponse(userMessage) {
            // Simulate network delay
            await new Promise(resolve => setTimeout(resolve, 1000 + Math.random() * 2000));
            
            const responses = [
                "That's an interesting challenge! Let me help you think through this step by step.",
                "I understand your concern. Here are a few approaches we could consider:",
                "Great question! This is a common issue in modern workplaces. Let me suggest some solutions:",
                "I appreciate you bringing this up. Let's break this down into manageable parts:",
                "That's a complex problem that requires careful consideration. Here's what I recommend:",
                "I can see how this would be challenging. Let me offer some strategic insights:",
                "This is exactly the kind of problem I love helping with! Here are some innovative approaches:",
                "You're right to focus on this. Let me provide some actionable recommendations:"
            ];
            
            const randomResponse = responses[Math.floor(Math.random() * responses.length)];
            
            // Add some structured suggestions
            const suggestions = [
                "• Start by clearly defining the problem scope",
                "• Identify the key stakeholders involved", 
                "• Consider both short-term and long-term solutions",
                "• Evaluate the potential impact on different teams",
                "• Create a timeline for implementation",
                "• Plan for potential obstacles and mitigation strategies"
            ];
            
            const randomSuggestions = suggestions
                .sort(() => 0.5 - Math.random())
                .slice(0, 3)
                .join('\n');
            
            return `${randomResponse}\n\n${randomSuggestions}\n\nWould you like me to elaborate on any of these points?`;
        }

        // Focus on input when page loads
        messageInput.focus();
    </script>
</body>
</html>
